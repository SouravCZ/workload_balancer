<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Equilibrium - AI-driven team workload and burnout intelligence for engineering organizations."
    />
    <title>Equilibrium - Team Operations</title>

    <!-- Ranade (headlines + body) -->
    <link href="https://api.fontshare.com/v2/css?f[]=ranade@400,500,600,700&display=swap" rel="stylesheet" />
    <!-- JetBrains Mono (labels + data) -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              /* ---- Ranade Alabaster: Forest Green + Alabaster ---- */
              primary: "#1b2d26",
              "primary-container": "#31433b",
              "on-primary": "#ffffff",
              "on-primary-container": "#9bafa5",
              "primary-fixed": "#d3e7dc",
              "primary-fixed-dim": "#b7cbc0",
              "on-primary-fixed": "#0d1f18",
              "on-primary-fixed-variant": "#384b42",
              secondary: "#4c6359",
              "on-secondary": "#ffffff",
              "secondary-container": "#cce6d9",
              "on-secondary-container": "#50685d",
              "secondary-fixed": "#cfe8db",
              "secondary-fixed-dim": "#b3ccc0",
              tertiary: "#3a2423",
              "on-tertiary": "#ffffff",
              "tertiary-container": "#523938",
              "on-tertiary-container": "#c5a3a1",
              "tertiary-fixed": "#ffdad8",
              "tertiary-fixed-dim": "#e2bebc",
              error: "#ba1a1a",
              "on-error": "#ffffff",
              "error-container": "#ffdad6",
              "on-error-container": "#93000a",
              surface: "#FAF9F6",
              background: "#FAF9F6",
              "on-background": "#1a1c1a",
              "surface-bright": "#ffffff",
              "surface-dim": "#dbdcc3",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#F4F3F0",
              "surface-container": "#efeeeb",
              "surface-container-high": "#E9E8E5",
              "surface-container-highest": "#E4E3E0",
              "surface-variant": "#e3e2e0",
              "on-surface": "#1a1c1a",
              "on-surface-variant": "#424845",
              outline: "#737875",
              "outline-variant": "#c2c8c3",
              "surface-tint": "#50625a",
              "inverse-surface": "#2f312f",
              "inverse-on-surface": "#f2f1ee",
              "inverse-primary": "#b7cbc0",
              /* semantic risk ramp */
              "risk-amber": "#FEF3C7",
              "risk-amber-ink": "#8C6A1D",
              "risk-green": "#d3e7dc",
              "risk-green-ink": "#2f4f42",
              "risk-red": "#ffdad8",
              "risk-red-ink": "#93000a",
              "teal-brand": "#1b2d26",
            },
            maxWidth: {
              "container-max": "1280px",
            },
            borderRadius: {
              sm: "0.125rem",
              DEFAULT: "0.25rem",
              md: "0.375rem",
              lg: "0.5rem",
              xl: "0.75rem",
              card: "12px",
              full: "9999px",
            },
            spacing: {
              xs: "4px",
              sm: "8px",
              md: "16px",
              lg: "24px",
              xl: "48px",
              base: "4px",
              gutter: "24px",
              "margin-mobile": "16px",
              "margin-tablet": "32px",
              "margin-desktop": "64px",
              "section-gap": "48px",
            },
            fontFamily: {
              sans: ["Ranade", "ui-sans-serif", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "monospace"],
              "label-md": ["JetBrains Mono", "monospace"],
              "display-lg": ["Ranade", "sans-serif"],
              "headline-xl": ["Ranade", "sans-serif"],
              "headline-lg": ["Ranade", "sans-serif"],
              "headline-lg-mobile": ["Ranade", "sans-serif"],
              "headline-md": ["Ranade", "sans-serif"],
              "headline-sm": ["Ranade", "sans-serif"],
              "body-lg": ["Ranade", "sans-serif"],
              "body-md": ["Ranade", "sans-serif"],
              "body-sm": ["Ranade", "sans-serif"],
            },
            fontSize: {
              "display-lg": [
                "48px",
                { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
              "headline-xl": [
                "48px",
                { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
              "headline-xl-mobile": [
                "36px",
                { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
              "headline-lg": [
                "32px",
                { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" },
              ],
              "headline-lg-mobile": [
                "28px",
                { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "600" },
              ],
              "headline-md": [
                "24px",
                { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" },
              ],
              "headline-sm": [
                "20px",
                { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" },
              ],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "label-md": [
                "12px",
                { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #faf9f6;
        font-family: "Ranade", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24;
      }
      .icon-fill {
        font-variation-settings: "FILL" 1;
      }

      /* Level 1 card: white fill, 1px hairline, diffused ambient shadow */
      .card-border {
        border: 1px solid #e4e7ec;
      }
      .soft-shadow {
        box-shadow: 0px 2px 4px rgba(16, 24, 40, 0.05);
      }
      .lift-shadow {
        box-shadow: 0px 12px 16px rgba(16, 24, 40, 0.1);
      }
      .card-shadow {
        box-shadow: 0px 2px 4px rgba(16, 24, 40, 0.05);
      }
      .card-hover-shadow {
        box-shadow: 0px 8px 16px rgba(16, 24, 40, 0.08);
      }
      .task-card-bg {
        background-image: linear-gradient(160deg, #f4f3f0 0%, #efeeeb 100%);
      }

      /* Skill heatmap ramp: 1 novice -> 5 expert */
      .heatmap-1 {
        background-color: #f4f3f0;
        color: #50685d;
      }
      .heatmap-2 {
        background-color: #d3e7dc;
        color: #384b42;
      }
      .heatmap-3 {
        background-color: #b3ccc0;
        color: #091f18;
      }
      .heatmap-4 {
        background-color: #6b8a7c;
        color: #ffffff;
      }
      .heatmap-5 {
        background-color: #31433b;
        color: #ffffff;
      }

      /* Utilisation fill for healthy range */
      .utilization-bar-fill {
        background-image: linear-gradient(90deg, #31433b, #4c6359);
      }

      /* Diagonal stripes marking allocation beyond 100% of capacity */
      .overflow-hatch {
        background-image: repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.4),
          rgba(255, 255, 255, 0.4) 5px,
          transparent 5px,
          transparent 10px
        );
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #c2c8c3;
        border-radius: 9999px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #a8b0ab;
      }

      /* Dialog enter: backdrop fade + panel rise */
      @keyframes eqFade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes eqPop {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
